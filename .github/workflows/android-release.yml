name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Spoticy-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Spoticy ${{ github.ref_name }}
          body: |
            APK de débogage généré automatiquement pour ${{ github.ref_name }}.
            Cet APK est signé avec la clé de debug Android ; il n'est pas destiné au Play Store.
          files: Spoticy-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
