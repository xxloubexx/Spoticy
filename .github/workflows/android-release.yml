name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Spoticy-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Spoticy ${{ github.ref_name }}
          body: |
            APK de débogage généré automatiquement pour ${{ github.ref_name }}.
            Cet APK est signé avec la clé de debug Android ; il n'est pas destiné au Play Store.
          files: Spoticy-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
